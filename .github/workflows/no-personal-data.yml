name: No Personal Data

# Fail any PR that leaks personal workspace configuration or memory content
# into the public agistra.dev repository.
#
# Risk surface (agistra.dev-specific — NOT a copy of career-ops's no-user-data.yml):
#   workspace.config.json — gitignored personal config (name, org, tokens, relay IDs)
#   memory/*.md           — gitignored per-agent live memory (task state, HOT/WARM/COLD entries)
#
# A contributor PR could inadvertently expose these by:
#   1. Adding or modifying workspace.config.json directly
#   2. Adding or modifying files under memory/ that contain real content
#   3. Un-gitignoring either path (removing the protective .gitignore entries)
#   4. Hardcoding obvious personal values into example/template files
#
# The check is intentionally conservative: it flags the specific known-risky patterns
# rather than broad heuristics, to keep false positives low for legitimate PRs.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  no-personal-data:
    name: No personal data check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for personal data patterns
        run: |
          set -euo pipefail

          FAIL=0

          # ── 1. workspace.config.json must not be added or modified ────────────
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'workspace.config.json'; then
            echo "FAIL: workspace.config.json was added or modified."
            echo "  This file is gitignored because it contains personal workspace"
            echo "  configuration (name, org, tokens). Do not commit it."
            FAIL=1
          fi

          # ── 2. memory/*.md must not be added or modified ──────────────────────
          MEMORY_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^memory/.*\.md$' || true)
          if [ -n "$MEMORY_CHANGED" ]; then
            echo "FAIL: memory/*.md file(s) were added or modified:"
            echo "$MEMORY_CHANGED" | sed 's/^/  /'
            echo "  memory/ files are gitignored because they contain per-agent"
            echo "  live state (task history, HOT/WARM/COLD entries). Do not commit them."
            FAIL=1
          fi

          # ── 3. .gitignore must not un-gitignore workspace.config.json or memory/ ──
          # Look for lines that would negate an existing gitignore entry.
          GITIGNORE_DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- .gitignore || true)
          if echo "$GITIGNORE_DIFF" | grep -qE '^\+\s*!workspace\.config\.json'; then
            echo "FAIL: .gitignore change un-gitignores workspace.config.json."
            FAIL=1
          fi
          if echo "$GITIGNORE_DIFF" | grep -qE '^\+\s*!memory/'; then
            echo "FAIL: .gitignore change un-gitignores memory/."
            FAIL=1
          fi
          # Also catch removal of the protective entry (a plain - line removing it)
          if echo "$GITIGNORE_DIFF" | grep -qE '^-\s*workspace\.config\.json\s*$'; then
            echo "FAIL: .gitignore change removes the workspace.config.json protection."
            FAIL=1
          fi
          if echo "$GITIGNORE_DIFF" | grep -qE '^-\s*memory/\*\.md\s*$'; then
            echo "FAIL: .gitignore change removes the memory/*.md protection."
            FAIL=1
          fi

          # ── 4. Example/template files must not contain obvious personal values ─
          # Scan files added or modified by this PR for patterns that look like
          # personal data hardcoded into example content.
          # Patterns checked (conservative — targets the specific gitignored fields):
          #   "bot_token": "<non-placeholder value>"
          #   "relay_group_id": "<non-placeholder value>"
          #   email addresses that aren't placeholder examples
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(json|md|yaml|yml|js|ts)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            # bot_token value that looks real (not a placeholder like "YOUR_TOKEN" or "...")
            BOT_TOKEN_HIT=$(echo "$CHANGED_FILES" | xargs grep -lE '"bot_token"\s*:\s*"[0-9]{8,}:[A-Za-z0-9_-]{30,}"' 2>/dev/null || true)
            if [ -n "$BOT_TOKEN_HIT" ]; then
              echo "FAIL: Possible real Telegram bot token found in:"
              echo "$BOT_TOKEN_HIT" | sed 's/^/  /'
              FAIL=1
            fi

            # relay_group_id value that looks real (numeric group ID, not a placeholder)
            RELAY_GID_HIT=$(echo "$CHANGED_FILES" | xargs grep -lE '"relay_group_id"\s*:\s*"-[0-9]{10,}"' 2>/dev/null || true)
            if [ -n "$RELAY_GID_HIT" ]; then
              echo "FAIL: Possible real Telegram relay group ID found in:"
              echo "$RELAY_GID_HIT" | sed 's/^/  /'
              FAIL=1
            fi
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "One or more personal-data checks failed. See above for details."
            echo "See CONTRIBUTING.md for guidance on what should not be committed."
            exit 1
          fi

          echo "No personal data patterns detected."
